services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: msgriffe
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d msgriffe"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - msgriffe_postgres_data:/var/lib/postgresql/data

volumes:
  msgriffe_postgres_data:
